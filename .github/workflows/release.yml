name: Release

on:
  push:
    tags: ['v[0-9]*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.3.0.
        required: true
        type: string
      publish:
        description: Publish the GitHub Release after verification.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      upload_packages: true

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-packages
          path: artifacts
      - name: Publish verified packages to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: ./tools/Publish-GitHubRelease.ps1 -Tag $env:RELEASE_TAG

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Version tag to check out and validate for a release.
        type: string
        default: ''
      upload_packages:
        description: Save verified packages and release notes for the release job.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - name: Validate release version and prepare notes
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $release = ./tools/Get-ReleaseMetadata.ps1 -Tag $env:RELEASE_TAG
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $release.Notes | Set-Content -LiteralPath artifacts/release-notes.md -Encoding utf8
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
          dotnet-quality: ga
      - name: Check release workflow helpers
        shell: pwsh
        run: ./tests/ReleaseWorkflow.Tests.ps1
      - run: dotnet restore PrayerTimePlus.slnx
      - run: dotnet build PrayerTimePlus.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet format PrayerTimePlus.slnx --verify-no-changes --no-restore
      - run: dotnet test tests/PrayerTimePlus.Tests/PrayerTimePlus.Tests.csproj -c Release --no-build --no-restore
      - run: dotnet run --project examples/PrayerTimePlus.Example -c Release --no-build
      - run: dotnet run --project tools/PrayerTimePlus.DataGenerator -c Release --no-build -- --check
      - run: dotnet pack src/PrayerTimePlus/PrayerTimePlus.csproj -c Release --no-build --no-restore -o artifacts/packages
      - name: Verify local package consumer
        shell: pwsh
        run: ./tools/Verify-Package.ps1
      - name: Save verified release packages
        if: inputs.upload_packages && runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 7

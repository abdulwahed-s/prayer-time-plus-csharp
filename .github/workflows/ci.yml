name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
          dotnet-quality: ga
      - run: dotnet restore PrayerTimePlus.slnx
      - run: dotnet build PrayerTimePlus.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet format PrayerTimePlus.slnx --verify-no-changes --no-restore
      - run: dotnet test tests/PrayerTimePlus.Tests/PrayerTimePlus.Tests.csproj -c Release --no-build --no-restore
      - run: dotnet run --project examples/PrayerTimePlus.Example -c Release --no-build
      - run: dotnet run --project tools/PrayerTimePlus.DataGenerator -c Release --no-build -- --check
      - run: dotnet pack src/PrayerTimePlus/PrayerTimePlus.csproj -c Release --no-build --no-restore -o artifacts/packages
      - name: Verify local package consumer
        shell: pwsh
        run: ./tools/Verify-Package.ps1
